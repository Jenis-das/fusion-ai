<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fusion Ai</title>
    <style>
        *{
            border:  1px dotted black;
            margin: 0;
            padding: 0;
        }
        #chat-container{
            display: grid;
            grid-template-columns: 30% 70%;
            grid-template-rows: 100%;
            height: 90vh;
        }
        #side-pannel{
            display: grid;
            grid-template-rows: 90% 10%;
        }
        #chat-box{
            display: grid;
            grid-template-rows: 90% 10%;
        }
        #user-chat-area{
            display: grid;
            grid-template-columns: 90% 10%;
        }

        #apikey-window{
            position: absolute;
            left: 30px;
            top: 40px;
            height: 600px;
            width: 400px;
            z-index: 1;
            background-color: rgb(255, 255, 255);
            display: none;
            
        }
        #worker-ai-response{
            height: 50px;
            overflow: scroll;
            overflow-y: hidden;
            border: 1px solid black;
        }

        #judge-ai-response{
            border: 1px solid black;
        }

    </style>
</head>
<body>
    <a href="{% url 'logout' %}">Logout</a>

    <div id="chat-container">
        
        <div id="side-pannel">
            <button id="new-chat-btn">+ New Chat</button>
            <div id="history">
                <!-- JS fills this -->
            </div>
            <a href="{% url 'setting' %}"><button id="settings">Settings</button></a>
        </div>
        <div id="chat-box">
            <div id="chat-text">
                <div id="worker-ai-response">
                    workers data
                </div>
                <div id="judge-ai-response">
                    judge data
                </div>
            </div>
            <form action="" id="user-chat-area">
                <textarea name="user-chat-box" id="user-chat-box">
                    
                </textarea>
                <button type="submit">send</button>
            </form>
        </div>
    </div>
    




</body>
</html>
