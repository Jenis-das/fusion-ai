<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fusion AI</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
            :root {
        --bg:       #080a0e;   /* reactor void        */
        --bg2:      #0a0d13;   /* vessel hull         */
        --bg3:      #0d1219;   /* containment wall    */
        --bg4:      #121924;   /* inner casing        */
        --border:   #1a2235;   /* magnetic field coil */
        --border2:  #243044;   /* energized coil      */
        --text:     #d0d8f0;   /* neutron white       */
        --text2:    #7888a8;   /* plasma mist         */
        --text3:    #3d4a62;   /* dim field           */
        --accent:   #f97316;   /* plasma core         */
        --accent2:  #c2550e;   /* ignition ember      */
        --green:    #eed622;   /* Cherenkov glow      */
        --red:      #ff4d4d;   /* breach alarm        */
        --mono:     'Space Mono', monospace;
        --sans:     'DM Sans', sans-serif;
        --sidebar-w: 260px;
    }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; overflow: hidden; }

        /* ── App Shell ── */
        .app { display: flex; height: 100vh; overflow: hidden; }

        /* ── Sidebar ── */
        .sidebar {
            width: var(--sidebar-w);
            flex-shrink: 0;
            background: var(--bg2);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: width .2s ease;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .logo { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--accent); }
        .logo span { color: var(--text2); font-weight: 400; }

        .sidebar-actions { display: flex; gap: 6px; }

        .icon-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text2);
            width: 28px;
            height: 28px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .15s;
        }

        .icon-btn:hover { background: var(--bg3); color: var(--text); border-color: var(--border2); }

        .new-chat-btn {
            margin: 12px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 9px 14px;
            font-family: var(--sans);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: background .15s;
        }

        .new-chat-btn:hover { background: var(--accent2); }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 8px 8px;
        }

        .chat-list::-webkit-scrollbar { width: 4px; }
        .chat-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

        .chat-list-label {
            font-size: 10px;
            color: var(--text3);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 10px 8px 6px;
            font-weight: 600;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all .15s;
        }

        .chat-item:hover { background: var(--bg3); }
        .chat-item.active { background: var(--bg4); border-color: var(--border2); }

        .chat-item-name {
            flex: 1;
            font-size: 12.5px;
            color: var(--text2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-item.active .chat-item-name { color: var(--text); }

        .chat-item-del {
            background: none;
            border: none;
            color: var(--text3);
            font-size: 12px;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            opacity: 0;
            transition: opacity .15s, color .15s;
        }

        .chat-item:hover .chat-item-del { opacity: 1; }
        .chat-item-del:hover { color: var(--red); }

        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
        }

        .footer-btn {
            flex: 1;
            background: none;
            border: 1px solid var(--border);
            color: var(--text2);
            border-radius: 7px;
            padding: 7px 10px;
            font-size: 12px;
            cursor: pointer;
            font-family: var(--sans);
            transition: all .15s;
            text-decoration: none;
            text-align: center;
        }

        .footer-btn:hover { background: var(--bg3); color: var(--text); }

        /* ── Chat Area ── */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        .chat-topbar {
            height: 52px;
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg2);
            flex-shrink: 0;
        }

        .chat-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .topbar-pills { display: flex; gap: 6px; align-items: center; }

        .pill {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid var(--border2);
            color: var(--text2);
            background: var(--bg3);
        }

        /* ── Messages ── */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        /* Welcome screen */
        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
            gap: 12px;
        }

        .welcome-logo { font-family: var(--mono); font-size: 32px; color: var(--accent); margin-bottom: 8px; }
        .welcome-title { font-size: 20px; font-weight: 600; color: var(--text); }
        .welcome-sub { color: var(--text3); font-size: 13px; max-width: 360px; line-height: 1.6; }

        /* User message */
        .msg-user {
            display: flex;
            justify-content: flex-end;
        }

        .msg-user-bubble {
            background: var(--accent2);
            color: #fff;
            border-radius: 12px 12px 2px 12px;
            padding: 10px 16px;
            max-width: 70%;
            font-size: 13.5px;
            line-height: 1.55;
            word-break: break-word;
        }

        /* ── AI Response Group ── */
        .msg-ai-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            animation: fadeUp .3s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Workers strip */
        .workers-strip {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .workers-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            user-select: none;
        }

        .workers-header-label {
            font-size: 11px;
            color: var(--text3);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
        }

        .workers-count {
            font-size: 11px;
            color: var(--text3);
            background: var(--bg4);
            padding: 1px 7px;
            border-radius: 10px;
        }

        .workers-toggle {
            margin-left: auto;
            font-size: 11px;
            color: var(--text3);
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px 6px;
        }

        .workers-body { display: none; }
        .workers-body.open { display: block; }

        /* Provider tabs inside workers */
        .provider-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }

        .provider-tabs::-webkit-scrollbar { height: 2px; }

        .provider-tab {
            padding: 8px 16px;
            font-size: 12px;
            font-family: var(--mono);
            color: var(--text3);
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            white-space: nowrap;
            transition: all .15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .provider-tab:hover { color: var(--text2); }

        .provider-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .provider-tab .status-badge {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            flex-shrink: 0;
        }

        .provider-tab .status-badge.failed { background: var(--red); }

        .worker-panels { padding: 14px 16px; }

        .worker-panel { display: none; }
        .worker-panel.active { display: block; }

        .worker-panel-meta {
            font-size: 11px;
            color: var(--text3);
            font-family: var(--mono);
            margin-bottom: 10px;
        }

        .worker-panel-content {
            font-size: 13.5px;
            color: var(--text);
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .worker-error {
            color: var(--red);
            font-size: 12px;
            font-family: var(--mono);
        }

        /* ── Judge Card ── */
        .judge-card {
            background: linear-gradient(135deg, #1a1730 0%, #131316 60%);
            border: 1px solid rgba(124, 106, 247, 0.35);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .judge-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .judge-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(124, 106, 247, 0.2);
        }

        .judge-crown { font-size: 18px; }

        .judge-header-text { flex: 1; }

        .judge-header-label {
            font-size: 11px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 700;
        }

        .judge-provider-badge {
            font-size: 11px;
            color: var(--text3);
            font-family: var(--mono);
        }

        .judge-body { padding: 16px; }

        .judge-content {
            font-size: 13.5px;
            color: var(--text);
            line-height: 1.75;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Markdown-like rendering in judge content */
        .judge-content h2 {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            margin: 16px 0 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }

        .judge-content h2:first-child { margin-top: 0; }

        /* ── Loading / Thinking ── */
        .thinking {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text3);
            font-size: 13px;
        }

        .dots { display: flex; gap: 4px; }

        .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent);
            animation: bounce 1.2s infinite;
        }

        .dot:nth-child(2) { animation-delay: .2s; }
        .dot:nth-child(3) { animation-delay: .4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(.7); opacity: .4; }
            40%             { transform: scale(1);  opacity: 1;   }
        }

        /* ── Input Area ── */
        .input-area {
            border-top: 1px solid var(--border);
            background: var(--bg2);
            padding: 14px 20px 30px;
            flex-shrink: 0;
        }

        .input-options {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .input-options-label {
            font-size: 11px;
            color: var(--text3);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .judge-select {
            background: var(--bg3);
            border: 1px solid var(--border2);
            border-radius: 7px;
            color: var(--text);
            font-family: var(--mono);
            font-size: 11px;
            padding: 4px 10px;
            cursor: pointer;
            outline: none;
        }

        .judge-select:focus { border-color: var(--accent); }

        .input-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: var(--bg3);
            border: 1px solid var(--border2);
            border-radius: 12px;
            padding: 10px 12px;
            transition: border-color .2s;
        }

        .input-row:focus-within { border-color: var(--accent); }

        .prompt-input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text);
            font-family: var(--sans);
            font-size: 14px;
            resize: none;
            outline: none;
            line-height: 1.5;
            max-height: 160px;
            min-height: 24px;
        }

        .prompt-input::placeholder { color: var(--text3); }

        .send-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background .15s, transform .1s;
        }

        .send-btn:hover { background: var(--accent2); }
        .send-btn:active { transform: scale(.95); }
        .send-btn:disabled { background: var(--bg4); color: var(--text3); cursor: not-allowed; }

        /* ── Empty chat state ── */
        .no-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--text3);
        }
        .logo-link{
            text-decoration: none;
        }
        .no-chat-icon { font-size: 40px; }
        .no-chat-text { font-size: 14px; }

        /* ── Mobile ── */
        .sidebar-toggle { display: none; }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0; top: 0; bottom: 0;
                z-index: 50;
                transform: translateX(-100%);
                transition: transform .2s ease;
            }

            .sidebar.open { transform: translateX(0); }

            .sidebar-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
                background: none;
                border: none;
                color: var(--text2);
                font-size: 18px;
                cursor: pointer;
                padding: 4px 8px;
            }

            .msg-user-bubble { max-width: 90%; }
        }

        /* History rendering utilities */
        .history-group { display: flex; flex-direction: column; gap: 10px; }
    </style>
</head>
<body>

<div class="app">
    <!-- ── Sidebar ── -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="{% url 'chats_dashboard' %}" class="logo-link" ><span class="logo">Fusion<span>AI</span></span></a>
            <div class="sidebar-actions">
                <button class="icon-btn" onclick="loadHistory()" title="Refresh history">↻</button>
            </div>
        </div>

        <button class="new-chat-btn" onclick="newChat()">
            <span>+</span> New Chat
        </button>

        <div class="chat-list" id="chat-list">
            <div class="chat-list-label">Recent</div>
            <div id="chat-items" style="color:var(--text3);font-size:12px;padding:8px">Loading…</div>
        </div>

        <div class="sidebar-footer">
            <a href="/setting/" class="footer-btn">⚙ Settings</a>
            <a href="/logout/" class="footer-btn">↪ Logout</a>
        </div>
    </aside>

    <!-- ── Chat Area ── -->
    <section class="chat-area">
        <!-- Top bar -->
        <div class="chat-topbar">
            <button class="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
            <span class="chat-title" id="chat-title">Select or start a chat</span>
            <div class="topbar-pills" id="topbar-pills"></div>
        </div>

        <!-- Messages -->
        <div class="messages" id="messages">
            <div class="welcome">
                <div class="welcome-logo">⚡</div>
                <div class="welcome-title">Fusion AI</div>
                <div class="welcome-sub">Welcome to Fusion Ai </div>
            </div>
        </div>

        <!-- Input -->
        <div class="input-area" id="input-area">
            <div class="input-options">
                <span class="input-options-label">Judge:</span>
                <select class="judge-select" id="judge-select">
                    <option value="gemini">Gemini</option>
                    <option value="groq">Groq</option>
                    <option value="mistral">Mistral</option>
                    <option value="cerebras">Cerebras</option>
                    <option value="sambanova">Sambanova</option>
                    <option value="openrouter">OpenRouter</option>
                </select>
            </div>
            <div class="input-row">
                <textarea
                    class="prompt-input"
                    id="prompt-input"
                    placeholder="Ask all your AIs something…"
                    rows="1"
                    onkeydown="handleKey(event)"
                    oninput="autoResize(this)"
                ></textarea>
                <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Send">↑</button>
            </div>
        </div>
    </section>
</div>

<script>
/* ══════════════════════════════════════════════
   STATE
══════════════════════════════════════════════ */
let currentChatId = null;
let sending = false;

/* ══════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════ */
function csrfToken() {
    return document.cookie.split(';')
        .map(c => c.trim())
        .find(c => c.startsWith('csrftoken='))
        ?.split('=')[1] || '';
}

function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
}

function scrollBottom() {
    const m = document.getElementById('messages');
    m.scrollTop = m.scrollHeight;
}

/* ══════════════════════════════════════════════
   HISTORY SIDEBAR
══════════════════════════════════════════════ */
async function loadHistory() {
    const container = document.getElementById('chat-items');
    container.innerHTML = '<span style="color:var(--text3);font-size:12px">Loading…</span>';
    try {
        const res = await fetch('/history/');
        const data = await res.json();
        if (!data.chats || data.chats.length === 0) {
            container.innerHTML = '<span style="color:var(--text3);font-size:12px;padding:8px;display:block">No chats yet</span>';
            return;
        }
        container.innerHTML = '';
        data.chats.forEach(chat => {
            const div = document.createElement('div');
            div.className = 'chat-item' + (chat.id === currentChatId ? ' active' : '');
            div.dataset.id = chat.id;
            div.innerHTML = `
                <span class="chat-item-name" title="${escHtml(chat.name)}">${escHtml(chat.name)}</span>
                <button class="chat-item-del" onclick="deleteChat(event, ${chat.id})" title="Delete">✕</button>
            `;
            div.addEventListener('click', (e) => {
                if (e.target.classList.contains('chat-item-del')) return;
                openChat(chat.id, chat.name);
            });
            container.appendChild(div);
        });
    } catch (e) {
        container.innerHTML = '<span style="color:var(--red);font-size:12px">Failed to load</span>';
    }
}

async function deleteChat(e, id) {
    e.stopPropagation();
    const res = await fetch(`/delete-chat/${id}`);
    if (res.ok) {
        if (currentChatId === id) {
            currentChatId = null;
            document.getElementById('messages').innerHTML = '<div class="welcome"><div class="welcome-logo">⚡</div><div class="welcome-title">Fusion AI</div><div class="welcome-sub">Select or start a conversation.</div></div>';
            document.getElementById('chat-title').textContent = 'Select or start a chat';
        }
        loadHistory();
    }
}

/* ══════════════════════════════════════════════
   NEW CHAT
══════════════════════════════════════════════ */
async function newChat() {
    const res = await fetch('/new_chat/', {
        method: 'POST',
        headers: { 'X-CSRFToken': csrfToken(), 'Content-Type': 'application/json' },
        body: JSON.stringify({})
    });
    const data = await res.json();
    if (data.id) {
        openChat(data.id, data.name);
        loadHistory();
    }
}

/* ══════════════════════════════════════════════
   OPEN EXISTING CHAT
══════════════════════════════════════════════ */
async function openChat(id, name) {
    currentChatId = id;
    document.getElementById('chat-title').textContent = name || 'Chat';

    // Highlight in sidebar
    document.querySelectorAll('.chat-item').forEach(el => {
        el.classList.toggle('active', parseInt(el.dataset.id) === id);
    });

    const msgArea = document.getElementById('messages');
    msgArea.innerHTML = '<div class="thinking"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div> Loading history…</div>';

    try {
        const res = await fetch(`/chat-dashboard/${id}`);
        const data = await res.json();
        document.getElementById('chat-title').textContent = data.chat_name || name;
        msgArea.innerHTML = '';

        if (!data.messages || data.messages.length === 0) {
            msgArea.innerHTML = '<div style="text-align:center;color:var(--text3);padding:40px;font-size:13px">Send the first message</div>';
            return;
        }

        // Render history — group user + subsequent AI as a logical exchange
        renderHistory(data.messages);
    } catch(e) {
        msgArea.innerHTML = '<div style="color:var(--red);padding:20px;font-size:13px">Failed to load chat history</div>';
    }
}

/* ──────────────────────────────────────────
   Render history messages from server
   History messages: [{role, content, is_judge, model, provider, timestamp}]
   We reconstruct logical groups: user → [workers] → judge
────────────────────────────────────────── */
function renderHistory(messages) {
    const msgArea = document.getElementById('messages');
    msgArea.innerHTML = '';

    let i = 0;
    while (i < messages.length) {
        const msg = messages[i];

        if (msg.role === 'user') {
            appendUserBubble(msg.content, msg.timestamp);
            i++;
            // Collect subsequent assistant messages (workers + judge)
            const workers = [];
            let judge = null;
            while (i < messages.length && messages[i].role === 'assistant') {
                const am = messages[i];
                if (am.is_judge) {
                    judge = am;
                } else {
                    workers.push({
                        provider: am.provider || 'unknown',
                        model_name: am.model || am.provider || '—',
                        content: am.content,
                        status: 'success'
                    });
                }
                i++;
            }
            if (workers.length || judge) {
                const judgeData = judge ? {
                    provider: judge.provider || 'judge',
                    content: judge.content
                } : null;
                appendAIGroup(workers, judgeData);
            }
        } else {
            i++;
        }
    }
    scrollBottom();
}

/* ══════════════════════════════════════════════
   SEND MESSAGE
══════════════════════════════════════════════ */
async function sendMessage() {
    if (sending) return;
    const input = document.getElementById('prompt-input');
    const prompt = input.value.trim();
    if (!prompt) return;

    if (!currentChatId) {
        // Auto-create chat
        const res = await fetch('/new_chat/', {
            method: 'POST',
            headers: { 'X-CSRFToken': csrfToken(), 'Content-Type': 'application/json' },
            body: JSON.stringify({})
        });
        const data = await res.json();
        if (!data.id) return;
        currentChatId = data.id;
        document.getElementById('messages').innerHTML = '';
    }

    const judgeProvider = document.getElementById('judge-select').value;

    // Render user bubble immediately
    appendUserBubble(prompt, nowTime());
    input.value = '';
    input.style.height = 'auto';

    // Show thinking
    const thinkEl = appendThinking();

    sending = true;
    setSendDisabled(true);

    try {
        const res = await fetch(`/chat-dashboard/${currentChatId}/send`, {
            method: 'POST',
            headers: {
                'X-CSRFToken': csrfToken(),
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                prompt,
                ...(judgeProvider ? { judge_provider: judgeProvider } : {})
            })
        });

        const data = await res.json();

        // Remove thinking
        thinkEl.remove();

        if (!res.ok) {
            appendError(data.error || 'Request failed');
        } else {
            // Update chat title
            if (data.chat_name) {
                document.getElementById('chat-title').textContent = data.chat_name;
            }

            const judgeData = data.judge?.content ? data.judge : null;
            appendAIGroup(data.workers || [], judgeData);
            loadHistory();
        }
    } catch(e) {
        thinkEl.remove();
        appendError('Network error: ' + e.message);
    } finally {
        sending = false;
        setSendDisabled(false);
        scrollBottom();
    }
}

function setSendDisabled(disabled) {
    const btn = document.getElementById('send-btn');
    btn.disabled = disabled;
    btn.textContent = disabled ? '…' : '↑';
}

/* ══════════════════════════════════════════════
   DOM BUILDERS
══════════════════════════════════════════════ */
function appendUserBubble(text, time) {
    const msgArea = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg-user';
    div.innerHTML = `<div class="msg-user-bubble">${escHtml(text)}</div>`;
    msgArea.appendChild(div);
    scrollBottom();
    return div;
}

function appendThinking() {
    const msgArea = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'thinking';
    div.innerHTML = `
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        Consulting all AI models…
    `;
    msgArea.appendChild(div);
    scrollBottom();
    return div;
}

function appendError(msg) {
    const msgArea = document.getElementById('messages');
    const div = document.createElement('div');
    div.style.cssText = 'color:var(--red);font-size:12px;font-family:var(--mono);padding:10px 14px;background:var(--bg2);border:1px solid var(--red);border-radius:8px;opacity:.8';
    div.textContent = '⚠ ' + msg;
    msgArea.appendChild(div);
}

/* ─────────────────────────────────
   appendAIGroup(workers, judge)
   workers: [{provider, model_name, content, status, error}]
   judge:   {provider, content} | null
───────────────────────────────── */
function appendAIGroup(workers, judge) {
    const msgArea = document.getElementById('messages');
    const group = document.createElement('div');
    group.className = 'msg-ai-group';

    // ── Workers strip ──
    if (workers.length > 0) {
        const successWorkers = workers.filter(w => w.content);
        const strip = buildWorkersStrip(workers);
        group.appendChild(strip);
    }

    // ── Judge card ──
    if (judge && judge.content) {
        const card = buildJudgeCard(judge);
        group.appendChild(card);
    }

    msgArea.appendChild(group);
    scrollBottom();
    return group;
}

function buildWorkersStrip(workers) {
    const strip = document.createElement('div');
    strip.className = 'workers-strip';

    const successCount = workers.filter(w => w.content).length;
    const totalCount = workers.length;

    // Header (clickable to toggle)
    const header = document.createElement('div');
    header.className = 'workers-header';
    header.innerHTML = `
        <span class="workers-header-label">Worker Responses</span>
        <span class="workers-count">${successCount}/${totalCount}</span>
        <button class="workers-toggle">▼ Show</button>
    `;
    strip.appendChild(header);

    // Body
    const body = document.createElement('div');
    body.className = 'workers-body';

    // Provider tabs
    const tabRow = document.createElement('div');
    tabRow.className = 'provider-tabs';

    const panelArea = document.createElement('div');
    panelArea.className = 'worker-panels';

    workers.forEach((w, idx) => {
        const ok = w.status === 'success' && w.content;
        const tabId = `wtab-${Date.now()}-${idx}`;
        const panelId = `wpanel-${Date.now()}-${idx}`;

        // Tab button
        const tab = document.createElement('button');
        tab.className = 'provider-tab' + (idx === 0 ? ' active' : '');
        tab.dataset.panel = panelId;
        tab.dataset.tabGroup = strip;
        tab.innerHTML = `
            <span class="status-badge ${ok ? '' : 'failed'}"></span>
            ${escHtml(w.provider)}
        `;
        tab.addEventListener('click', () => {
            tabRow.querySelectorAll('.provider-tab').forEach(t => t.classList.remove('active'));
            panelArea.querySelectorAll('.worker-panel').forEach(p => p.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById(panelId).classList.add('active');
        });
        tabRow.appendChild(tab);

        // Panel
        const panel = document.createElement('div');
        panel.className = 'worker-panel' + (idx === 0 ? ' active' : '');
        panel.id = panelId;

        if (ok) {
            panel.innerHTML = `
                <div class="worker-panel-meta">${escHtml(w.model_name || w.provider)}</div>
                <div class="worker-panel-content">${renderMarkdownLite(w.content)}</div>
            `;
        } else {
            panel.innerHTML = `
                <div class="worker-panel-meta">${escHtml(w.model_name || w.provider)}</div>
                <div class="worker-error">⚠ ${escHtml(w.error || 'No response')}</div>
            `;
        }
        panelArea.appendChild(panel);
    });

    body.appendChild(tabRow);
    body.appendChild(panelArea);
    strip.appendChild(body);

    // Toggle on click
    header.addEventListener('click', () => {
        const isOpen = body.classList.toggle('open');
        header.querySelector('.workers-toggle').textContent = isOpen ? '▲ Hide' : '▼ Show';
    });

    return strip;
}

function buildJudgeCard(judge) {
    const card = document.createElement('div');
    card.className = 'judge-card';
    card.innerHTML = `
        <div class="judge-header">
            <span class="judge-crown">👑</span>
            <div class="judge-header-text">
                <div class="judge-header-label">Judge Verdict</div>
                <div class="judge-provider-badge">by ${escHtml(judge.provider)}</div>
            </div>
        </div>
        <div class="judge-body">
            <div class="judge-content">${renderMarkdownLite(judge.content)}</div>
        </div>
    `;
    return card;
}

/* ══════════════════════════════════════════════
   MINIMAL MARKDOWN RENDERER
   Handles: ## headings, **bold**, `code`, line breaks
══════════════════════════════════════════════ */
function renderMarkdownLite(text) {
    if (!text) return '';
    let html = escHtml(text);
    // Headings ## and ###
    html = html.replace(/^### (.+)$/gm, '<h3 style="font-size:13px;font-weight:600;color:var(--text2);margin:12px 0 6px">$1</h3>');
    html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    html = html.replace(/^# (.+)$/gm, '<h2 style="font-size:15px">$1</h2>');
    // Bold
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong style="color:var(--text);font-weight:600">$1</strong>');
    // Inline code
    html = html.replace(/`(.+?)`/g, '<code style="background:var(--bg4);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-family:var(--mono);font-size:11px">$1</code>');
    // Line breaks
    html = html.replace(/\n/g, '<br>');
    return html;
}

/* ══════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════ */
function escHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function nowTime() {
    return new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
}

/* ══════════════════════════════════════════════
   INIT
══════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
    loadHistory();
});
</script>
